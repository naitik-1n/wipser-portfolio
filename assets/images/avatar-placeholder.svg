<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="70%" stop-color="#f5ede3" />
      <stop offset="100%" stop-color="#ebe0d1" />
    </radialGradient>
    <linearGradient id="avatarAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="60%" stop-color="#f2541b" />
      <stop offset="100%" stop-color="#d63b04" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#avatarGlow)" stroke="#f2541b" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffcc00" stroke-width="0.8" stroke-dasharray="3 4" stroke-opacity="0.5" />
  
  <!-- Sacred Geometric Stylized Engineer Glyph -->
  <g transform="translate(100, 92)">
    <!-- Head / Celestial Sphere -->
    <circle cx="0" cy="-18" r="24" fill="#ffffff" stroke="url(#avatarAccent)" stroke-width="2.2" />
    <circle cx="0" cy="-18" r="7" fill="#f2541b" />
    
    <!-- Torso / Architectural Arcs -->
    <path d="M -42,42 C -36,12 -18,0 0,0 C 18,0 36,12 42,42" fill="none" stroke="url(#avatarAccent)" stroke-width="2.4" stroke-linecap="round" />
    <path d="M -30,42 C -24,20 -12,12 0,12 C 12,12 24,20 30,42" fill="none" stroke="#ffcc00" stroke-width="1.2" stroke-opacity="0.75" />
    <circle cx="0" cy="16" r="3" fill="#f2541b" />
  </g>
</svg>

